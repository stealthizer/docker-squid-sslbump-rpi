# Squid Configuration with SSL Bump
# Network and port configuration
http_port 3128 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB cert=/usr/local/squid/ssl/bluestar.crt key=/usr/local/squid/ssl/bluestar.pem
https_port 3131 intercept ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB cert=/usr/local/squid/ssl/bluestar.crt key=/usr/local/squid/ssl/bluestar.pem

# ACLs - Access Control Lists (must be defined before use)
acl localnet src 10.0.0.0/8     # RFC1918 possible internal network
acl localnet src 172.16.0.0/12  # RFC1918 possible internal network
acl localnet src 192.168.0.0/16 # RFC1918 possible internal network
acl localnet src fc00::/7        # RFC 4193 local private network range
acl localnet src fe80::/10       # RFC 4291 link-local (directly plugged) machines

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# Block YouTube Shorts - comprehensive blocking
acl youtube_shorts url_regex -i youtube\.com/shorts
acl youtube_shorts_path urlpath_regex -i /shorts
acl youtube_domain dstdomain .youtube.com youtube.com
acl googlevideo_domain dstdomain .googlevideo.com googlevideo.com
# Block Shorts API endpoints (this is the key!)
acl youtube_shorts_reel url_regex -i /youtubei/v1/reel/
acl youtube_shorts_api url_regex -i reel_watch_sequence
acl youtube_shorts_item url_regex -i reel_item_watch
# Block shorts video parameters in URLs
acl shorts_video_params url_regex -i [?&]shorts=
acl shorts_referer_header req_header Referer -i /shorts/

# SSL Bump configuration
sslcrtd_program /usr/local/squid/libexec/security_file_certgen -s /usr/local/squid/var/lib/ssl_db -M 4MB
sslcrtd_children 8

# SSL Bump steps - ensure YouTube is always bumped
acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

# TLS/SSL options
sslproxy_cert_error allow all
tls_outgoing_options flags=DONT_VERIFY_PEER options=NO_SSLv3:NO_TLSv1

# Force bump YouTube to inspect all traffic
ssl_bump peek step1 all
ssl_bump bump step2 youtube_domain
ssl_bump splice step2 all
ssl_bump bump step3

# Access rules - ALLOW EVERYTHING (customize as needed)
http_access allow localhost manager
http_access deny manager
# Block YouTube Shorts comprehensively
http_access deny youtube_shorts
http_access deny youtube_shorts_path
http_access deny youtube_shorts_reel
http_access deny youtube_shorts_api
http_access deny youtube_shorts_item
http_access deny youtube_domain youtube_shorts_path
http_access deny shorts_video_params
http_access deny shorts_referer_header
http_access deny googlevideo_domain shorts_referer_header
# Allow everything else
http_access allow all

# Cache and user settings
cache_effective_user squid
cache_effective_group squid

# Routing
always_direct allow all

# ICAP configuration
icap_enable off
icap_service_failure_limit -1

# Cache settings - disabled for simplicity (enable if needed)
# cache_dir ufs /usr/local/squid/var/cache/squid 100 16 256
cache deny all
coredump_dir /usr/local/squid/var/cache

# Logging
access_log daemon:/usr/local/squid/var/logs/access.log squid
cache_log /usr/local/squid/var/logs/cache.log
debug_options ALL,1 33,2

# Misc
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
